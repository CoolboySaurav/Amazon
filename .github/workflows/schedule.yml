name: Daily Update Number

on:
  schedule:
    - cron: '34 15 * * *'
  workflow_dispatch:

jobs:
  update-number:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Git user
        run: |
          git config --global user.email "sauravm@arizona.edu"
          git config --global user.name "Coolboy_saurav"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run update_number.py
        run: python update_number.py

      - name: Debug repository status
        run: |
          echo "Contents of number.txt:"
          cat number.txt
          echo "Git status:"
          git status

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add number.txt
          git commit -m "Updated number from GitHub Actions" || echo "Nothing to commit"
          git push
