name: Daily Update Number

# Controls when the workflow will run
on:
  schedule:
    # Runs at 3:00 PM UTC every day (adjust for your desired timezone)
    - cron: '6 10 * * *'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  update-number:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checkout the repository to the runner
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up Python for the script execution
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # Install dependencies if needed
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Run the update_number.py script
    - name: Run update_number.py
      run: python update_number.py
